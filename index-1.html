<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#076b4f">
<title>Cálculo Peso / Milheiro</title>
<style>
*{box-sizing:border-box}
:root{
  --verde:#076b4f;
  --verde-claro:#076b4f;
  --verde-muito-claro:#edf7f1;
  --texto:#17352a;
  --cinza:#66756e;
  --borda:#cfe1d8;
}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f7f5;
  color:var(--texto);
}
.app{max-width:480px;margin:auto;padding:14px}
.topo{
  background:var(--verde);
  border-radius:18px;
  padding:14px 16px 18px;
  margin-bottom:14px;
  color:white;
  position:relative;
  min-height:86px;
}
.topo h1{
  font-size:22px;
  margin:4px 82px 4px 0;
}
.topo .sub{
  margin:0;
  font-size:13px;
  opacity:.92;
}
.logo{
  position:absolute;
  right:12px;
  top:10px;
  width:68px;
  height:68px;
  object-fit:contain;
}
.card{
  background:white;
  border-radius:18px;
  padding:20px;
  margin-bottom:15px;
  box-shadow:0 4px 18px rgba(0,60,40,.10);
  border:1px solid #e4eee9;
}
h2{font-size:20px;margin:0 0 14px;color:var(--verde)}
label{
  display:block;
  font-weight:700;
  font-size:14px;
  margin:13px 0 6px;
}
input{
  width:100%;
  padding:13px;
  border:1px solid var(--borda);
  border-radius:10px;
  font-size:17px;
  color:var(--texto);
  background:#fbfdfc;
  outline:none;
}
input:focus{
  border-color:var(--verde);
  box-shadow:0 0 0 3px rgba(7,107,79,.10);
}
button{
  width:100%;
  border:0;
  border-radius:11px;
  padding:14px;
  font-size:17px;
  font-weight:700;
  background:var(--verde);
  color:white;
  margin-top:18px;
  box-shadow:0 3px 8px rgba(30,90,40,.20);
}
button:active{transform:scale(.99)}
.result{
  background:var(--verde-muito-claro);
  border:1px solid #d7ebdf;
  border-radius:12px;
  padding:15px;
  margin-top:16px;
}
.big{font-size:27px;font-weight:800;margin:5px 0;color:var(--verde)}
.muted{color:var(--cinza);font-size:13px}
.rodape{
  text-align:center;
  color:#718078;
  font-size:12px;
  padding:4px 0 10px;
}
@media (max-width:360px){
  .app{padding:10px}
  .card{padding:16px}
  .topo h1{font-size:20px}
}
</style>
</head>
<body>
<div class="app">

  <div class="topo">
    <img class="logo" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAIwAAACbCAYAAACwE3MdAAABMmlDQ1BJQ0MgUHJvZmlsZQAAeJx9kD9Lw0AYxn+Wgv8H0dEhYxelKuigLlUsOkmNYHVK0zQVmhiSlCK4+QX8EIKzowi6CjoIgpvgRxAH1/qkQdIlvsd797vnHu7ufaEwhqJYBs+Pw1q1YhzVj43RT0Y0BmHZUUB+yPXznnrfFv7x5cV404lsrV/KZqjHdaUpnnNTbifcSPki4V4cxOKrhEOztiW+FpfcIW4MsR2Eif9FvOF1unb2b6Yc//BA645ynm1OiQjoYHGOwT4rmqvaeXSJxT05YtqiiJpOKiKTUA5fSgtHTNK/9InLD9h86Pf795m29wi3azBxl2mldZiZhKfnTMt6GlihNZCKykKrBd83MF2H2Vfdc/LXyJzajEFtVc40XNXmSNnVf20WRcuUWWL1Fx+iTfmvd1mpAAAEnklEQVR4nO3d627iMBCG4Y9V7/+W2R9tJQo5eGyPDzPvK612pRZIwoNJ4sA+ns+niEr7N3sBaK8AQ6a+Ln620nvVY/YCHLTS9mnJtG3PRpgoG8OrtNvnDMyKr+hVioTF/DyzD2MrNRYJMJbSY5EAUxpYfgLMfWB5CTDXgeUtwJwHloMAcxxYTgLMZ2C5CDB/i4TFpau5pGxFwuJ2pp4R5juwFAYYsJjKDgYsxjKDAUtFWcGApbKMYMDSUDYwYGksExiwdCgLGLB0KgMYsHQsOhiwdC4yGLA4FBUMWJyKCAYsjkUDAxbnIoEBy4CigAHLoCKAAcvAIoCJ0vJYJMCs0hZYJMCs0DZYJMDMbissEmBmth0WCTCz2hKLBJgZbYtFAszotsYiAWZk22ORADOqEFgkwIwoDBYJMN6FwiIBxrNwWCTAeBUSiwQYj8JikQDTu9BYJMD0LDwWCTC9SoFFAkyP0mCRANNaKiwSYFpKh0UCTG0psUiAqSktFgkw1lJjkQBDxgBDpgBj66lYH801B5i60qIBTH0p0QCmrXRoANNeKjSA6VMaNIDpVwo0gOlbeDSA6V9oNIDxKSwawPgV8qwwYMgUYPwLNcoAhkwBZkxhRpmv2QuQqFc02165xwgzp21HHMCQKcDMa8tRBjBz2w4NYOa3FRrArNE2aACzTlugiQBm23MaOxYBTKSWn+GOAibaKLMsmihgJNAMKRIY6RtNJDjLoYkG5jfQOBUVjAQalyKDkUDTvehgpHhopsLJAIY6lgVMpFFGmjjKZAEjccjdpUxgIjYcTUYwjDQNZQTzG2gqygxGAo257GAk0JgCTLxc0QDmO3aECwPM30BzE2A+A81FgDkONCcB5jzQHASY60DzFmDuA81LgMlXExrAlMV5mp8AYys9GsDYS40GMHWlRQOY+lKiAUxb6dAApr1UaADTpyhobtfj6pvAo2yEUaXYXowwZAowZAowZAowZAowZAowZAowZAowZAowZAowZOoKzBLf2uhU73V7vz/v+5/W4/k8XZazH7zPmZSszKPw965uX/J4JfM5tctxdN9391U7vzRyHU3L2PqWVIqltRVeYaO+8rT1May3d7/irkbvCk94r2avi8fju19xV/Jqe5z8u6bVLh3wQjN6dDHf1usoabUnmDrlAaZm5/D9tu9/j2yHD63VjCRd1uvqiruazhao9Cjp+fb31X1613pkZ837sUqPei9b/cTd7B3MlZuybXqPMBHKhvR3fYtGmt4jzNRDvo3rtY4tb99hPpe04g7oKst09CS7LpsHmOgjwipYrvKYkpDktw/zlH2hIz8RI1vyi52tE2Cu8xuO9/GaF5YeZ3df/xzV7dxS7QhjXcmScxp3lwjUzNLW3EfphrWcV2p5nJLutu/Ub9F8qFzsbvszliex9QnvOfu9zX9/U4qm11vMzMm51esxYjV9GJ/mVnvBVs8LxD7qcVg96sihx47bDkc     <h1>📦 Peso / Milheiro</h1>
    <p class="sub">Calculadora baseada na sua planilha.</p>
  </div>

  <div class="card">
    <label>Comprimento (cm)</label>
    <input id="comp" type="number" step="any" value="210">

    <label>Largura (cm)</label>
    <input id="larg" type="number" step="any" value="100">

    <label>Espessura (cm)</label>
    <input id="esp" type="number" step="any" value="0.002">

    <label>Peso (kg)</label>
    <input id="peso" type="number" step="any" value="30">

    <button onclick="calcular()">CALCULAR MILHEIRO</button>

    <div class="result">
      <div class="muted">Quantidade calculada</div>
      <div class="big" id="milheiro">—</div>
      <div class="muted" id="unidades">—</div>
    </div>
  </div>

  <div class="card">
    <h2>⚖️ Milheiro → Kg</h2>
    <label>Quantidade (milheiro)</label>
    <input id="mil" type="number" step="any" value="1">

    <button onclick="calcularKg()">CALCULAR PESO</button>

    <div class="result">
      <div class="muted">Peso calculado</div>
      <div class="big" id="kg">—</div>
    </div>
  </div>

  <div class="rodape">Calculadora Peso / Milheiro</div>
</div>

<script>
function n(id){return parseFloat(document.getElementById(id).value)||0}

function calcular(){
  const c=n('comp'), l=n('larg'), e=n('esp'), p=n('peso');
  if(!c||!l||!e||!p){alert('Preencha todos os campos.');return}
  const unidades=(p/(c*l*e))*1000;
  document.getElementById('milheiro').textContent=unidades.toLocaleString('pt-BR',{maximumFractionDigits:2});
  document.getElementById('unidades').textContent='unidades (conforme a fórmula da planilha)';
}

function calcularKg(){
  const c=n('comp'), l=n('larg'), e=n('esp'), m=n('mil');
  if(!c||!l||!e||!m){alert('Preencha os campos.');return}
  const kg=c*l*e*(m*1000)/1000;
  document.getElementById('kg').textContent=kg.toLocaleString('pt-BR',{maximumFractionDigits:3})+' kg';
}

calcular();
calcularKg();
</script>
</body>
</html>
